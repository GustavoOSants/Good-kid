<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre a banda good kid">
    <meta name="author" content="Gustavo Oliveira">
    <link rel="icon" type="image/png" sizes="32x32" href="images/gk.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Contato</title>
</head>

<body>
    <header>
        <a href="index.html"><img src="images/gif.gif" alt="" height="45"></a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contato">
            <div class="titulo">
                <h1>Contato</h1>
                <p>Envie uma mensagem para a banda</p>
            </div>
            <div class="conteudo">
                <img src="images/Orbit.jpg" alt="">
                <div class="texto">
                    <form action="">
                        <label for="nome">Nome</label> <br>
                        <input type="text" id="nome" name="nome" placeholder="Gustavo Oliveira" required><br>

                        <label for="email">Email</label> <br>
                        <input type="email" id="email" name="email" placeholder="email@email.com" required><br>

                        <label for="assunto">Assunto</label> <br>
                        <input type="text" id="assunto" name="assunto" placeholder="Musicas" required><br>

                        <label for="">Categoria:</label><br>
                        <select name="" id="">
                            <option value="agradecimento">Agradecimento</option>
                            <option value="relato">Relato Pessoal</option>
                            <option value="pergunta">Pergunta</option>
                            <option value="mensagem">Mensagem divertida</option>
                            <option value="sugestao">Seguestão</option>
                        </select>
                        <br>
                        <label for="comentario">Comentário:</label> <br>
                        <textarea type="text" id="comentario" name="comentario" rows="11"
                            placeholder="Adoro suas musicas" required></textarea><br>



                        <button type="submit">Enviar</button>
                    </form>
                </div>


            </div>


    </main>

    <footer>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
        <p>©2026 Gustavo Oliveira. Todos os direitos reservados</p>
    </footer>

</body>

</html>
