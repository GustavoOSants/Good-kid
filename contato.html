<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre a banda good kid">
    <meta name="author" content="Gustavo Oliveira">
    <link rel="icon" type="image/png" sizes="32x32" href="images/gk.png">
    <title>Contato</title>
</head>
<body>
    <header>
         <img src="images/gif.gif" alt="">
         <nav>
         <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contato.html">Contato</a></li>
         </ul>
         </nav>
    </header>

    <main>
        <h2>Contato</h2>
        <h3>Envie uma mensagem para um dos integrantes</h3>
        <section>
            <form action="">
                <label for="nome">Nome</label> <br>
                <input type="text" id="nome" name="nome"><br>

                <label for="email">Email</label> <br>
                <input type="email" id="email" name="email"><br>

                <label for="assunto">Assunto</label> <br>
                <input type="text" id="assunto" name="assunto"><br>

                <label for="">Categoria</label>
                <select name="" id="">
                    <option value="agradecimento">Agradecimento</option>
                    <option value="relato">Relato Pessoal</option>
                    <option value="pergunta">Pergunta</option>
                    <option value="mensagem">Mensagem divertida</option>
                    <option value="seguestao">Seguestão</option>
                </select>

                <label for="comentario">Comentário</label> <br>
                <input type="text" id="comentario" name="comentario"><br>

                <label for="nick"> Nick Frosst</label>
                <input type="checkbox" name="nick" id="nick"><br>

                <label for="jon"> Jon Kereliuk</label>
                <input type="checkbox" name="jon" id="jon"><br>

                <label for="michael"> Michael Kozakov</label>
                <input type="checkbox" name="michael" id="michael"><br>

                <label for="david">David Wood</label>
                <input type="checkbox" name="david" id="david"><br>

                <label for="jacob">Jacob Tsafatinos</label>
                <input type="checkbox" name="jacob" id="jacob"><br>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <img src="images/Orbit.jpg" alt="">

    </main>

    <footer>
        <nav>
            <ul>

                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
        <p>©2026 Gustavo Oliveira. Todos os direitos reservados</p>
    </footer>
    
</body>
</html>
